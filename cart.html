<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart · Eluru Foods</title>
<link rel="stylesheet" href="css/liquid-glass.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
body { padding-bottom: 380px; }
.header-title { font-size: 17px; font-weight: 800; color: var(--ink); }
.cart-section-head { padding: 16px 20px 6px; display: flex; align-items: center; gap: 12px; }
.cart-section-title { font-size: 11px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
.cart-section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--ink-faint), transparent); }

.cart-card {
  display: flex; justify-content: space-between; align-items: center;
  margin: 10px 16px; padding: 14px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  gap: 12px;
}
.food-left { display: flex; gap: 13px; align-items: center; flex: 1; min-width: 0; }
.food-line-total { font-size: 13.5px; font-weight: 800; color: var(--ink); }

.empty-cart { text-align: center; padding: 80px 30px 40px; color: var(--ink-muted); }
.empty-cart svg.icon { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.35; }
.empty-cart h3 { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
.empty-cart p { font-size: 13px; color: var(--ink-faint); }
.empty-cart .empty-cta {
  display: inline-block; margin-top: 22px; padding: 12px 28px;
  background: var(--ink); color: #fff; border-radius: 30px;
  font-weight: 700; font-size: 13px; text-decoration: none;
}

.summary {
  position: fixed; bottom: 210px; left: 0; right: 0;
  background: var(--glass-strong);
  backdrop-filter: blur(26px) saturate(180%);
  border-top: 1px solid var(--glass-border);
  padding: 14px 20px 10px; z-index: 150;
}
</style>
</head>

<body>

<div id="loader">
  <div class="load-ring"></div>
  <h2>Eluru Foods</h2>
</div>

<div class="page-header">
  <a class="header-icon-btn" href="restaurant.html">
    <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <div class="header-title">Your Cart</div>
</div>

<div class="cart-section-head">
  <div class="cart-section-title">Order Items</div>
  <div class="cart-section-line"></div>
</div>

<div class="cart-container" id="cart"></div>

<div class="summary" id="summaryBox">
  <div class="summary-row"><span>Item Total</span><span id="subtotal">₹0</span></div>
  <div class="summary-row"><span>Delivery Fee</span><span id="deliveryFee">₹30</span></div>
  <div class="summary-row"><span>Platform Fee</span><span id="platformFee">₹0</span></div>
  <div class="summary-row total-row"><span>Total</span><span id="total">₹0</span></div>
</div>

<button class="checkout-btn" id="checkoutBtn" onclick="goCheckout()">
  <span>Proceed to Checkout</span>
  <span class="checkout-arrow"><svg class="icon" style="width:16px;height:16px;stroke:#fff;" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
</button>

<div class="bottom-nav">
  <a href="home.html" class="nav-item">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
  <a href="cart.html" class="nav-item active">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2.5l2.5 12.5h10L20 7H6"/></svg>
    Cart
    <span id="cart-count"></span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
    Profile
  </a>
</div>

<!-- ══ ALL ORIGINAL FIREBASE LOGIC (UNTOUCHED) ══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:    "AIzaSyD_AhACSdb6ddlmNWU3UNKxUSBj-0pSIA8",
  authDomain:"food-delivery-app-97300.firebaseapp.com",
  projectId: "food-delivery-app-97300"
};
initializeApp(firebaseConfig);
const db   = getFirestore();
const auth = getAuth();

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }

  let platformFee = 3;
  let deliveryFee = 30;

  const settingsSnap = await getDoc(doc(db, "settings", "appConfig"));
  if (settingsSnap.exists()) {
    const s    = settingsSnap.data();
    platformFee = s.platformFee || 3;
    const distance = Number(localStorage.getItem("restaurantDistance")) || 0;
    if      (distance <= 3)  deliveryFee = s.fee0to3   || 30;
    else if (distance <= 7)  deliveryFee = s.fee3to7   || 50;
    else if (distance <= 10) deliveryFee = s.fee7to10  || 70;
    else                     deliveryFee = s.fee10plus || 100;
  }

  let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
  let container = document.getElementById("cart");

  const subtotalEl  = document.getElementById("subtotal");
  const totalEl     = document.getElementById("total");
  const summaryBox  = document.getElementById("summaryBox");
  const checkoutBtn = document.getElementById("checkoutBtn");

  function updateCartCount() {
    const count = cartItems.reduce((s, i) => s + i.qty, 0);
    const badge = document.getElementById("cart-count");
    if (count > 0) { badge.innerText = count; badge.style.display = "inline-block"; }
    else           { badge.style.display = "none"; }
  }

  function renderCart() {
    container.innerHTML = "";
    let subtotal = 0;

    if (cartItems.length === 0) {
      container.innerHTML = `
        <div class="empty-cart">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2.5l2.5 12.5h10L20 7H6"/></svg>
          <h3>Your cart is empty</h3>
          <p>Add something delicious to get started</p>
          <a href="home.html" class="empty-cta">Browse Restaurants</a>
        </div>`;
      summaryBox.style.display  = "none";
      checkoutBtn.style.display = "none";
      updateCartCount();
      return;
    }

    summaryBox.style.display  = "block";
    checkoutBtn.style.display = "flex";

    cartItems.forEach((item, index) => {
      subtotal += item.price * item.qty;
      const lineTotal = item.price * item.qty;

      const div = document.createElement("div");
      div.className = "cart-card";

      div.innerHTML = `
        <div class="food-left">
          <img class="food-image" src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80'}" alt="${item.name}">
          <div style="min-width:0;">
            <div class="food-name">${item.name}</div>
            <div class="food-desc" style="-webkit-line-clamp:1;">₹${item.price} each</div>
            <div class="quantity-box">
              <button onclick="decrease(${index})">−</button>
              <span class="qty-num">${item.qty}</span>
              <button onclick="increase(${index})">+</button>
            </div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="food-line-total">₹${lineTotal}</div>
        </div>`;

      container.appendChild(div);
    });

    document.getElementById("deliveryFee").innerText = "₹" + deliveryFee;
    document.getElementById("platformFee").innerText = "₹" + platformFee;
    subtotalEl.innerText = "₹" + subtotal;
    totalEl.innerText    = "₹" + (subtotal + deliveryFee + platformFee);
    updateCartCount();
  }

  window.increase = function (index) {
    cartItems[index].qty++;
    localStorage.setItem("cart", JSON.stringify(cartItems));
    renderCart();
  };

  window.decrease = function (index) {
    if (cartItems[index].qty > 1) { cartItems[index].qty--; }
    else                          { cartItems.splice(index, 1); }
    localStorage.setItem("cart", JSON.stringify(cartItems));
    renderCart();
  };

  window.goCheckout = function () {
    if (cartItems.length === 0) { alert("Cart empty"); return; }

    const restaurantId = cartItems[0].restaurantId;
    const mixed = cartItems.some(i => i.restaurantId !== restaurantId);
    if (mixed) { alert("Only one restaurant allowed per order"); return; }

    const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
    localStorage.setItem("checkoutData", JSON.stringify({
      items: cartItems, restaurantId, subtotal, deliveryFee, platformFee,
      total: subtotal + deliveryFee + platformFee
    }));
    window.location.href = "checkout.html";
  };

  renderCart();
});
</script>

<!-- ── SERVICE WORKER ── -->
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
</script>

<!-- ── LOADER HIDE ── -->
<script>
window.addEventListener("load", () => {
  setTimeout(() => { document.getElementById("loader").classList.add("hidden"); }, 500);
});
</script>

</body>
</html>
