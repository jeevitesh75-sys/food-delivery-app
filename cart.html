<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart · Eluru Foods</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#249B55">
</head>

<body>

<div id="loader">
  <div class="load-ring"></div>
  <h2>Eluru Foods</h2>
</div>

<div class="page-header">
  <a class="header-icon-btn" href="restaurant.html" aria-label="Back">
    <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <div class="header-title">Your Cart</div>
</div>

<!-- ── Restaurant info ── -->
<div id="cartRestaurant"></div>

<div class="cart-section-head" style="padding:16px 16px 0;">
  <div class="cart-section-title">Order Items</div>
  <div class="cart-section-line"></div>
</div>

<div class="cart-list" id="cart"></div>

<!-- ── Bill details ── -->
<div class="bill-card" id="summaryBox" style="display:none;">
  <div class="bill-title">Bill details</div>

  <div class="coupon-box">
    <input type="text" id="couponInput" placeholder="Enter coupon code" autocomplete="off">
    <button class="coupon-btn" id="couponBtn" type="button">Apply</button>
  </div>
  <div class="coupon-note" id="couponNote"></div>

  <div class="summary-row"><span>Item total</span><span id="subtotal">₹0</span></div>
  <div class="summary-row"><span>Delivery fee</span><span id="deliveryFee">₹30</span></div>
  <div class="summary-row"><span>Platform fee</span><span id="platformFee">₹0</span></div>
  <div class="summary-row" id="discountRow" style="display:none;"><span>Discount</span><span id="discountValue">-₹0</span></div>
  <div class="summary-row total-row"><span>To pay</span><span id="total">₹0</span></div>
</div>

<button class="checkout-btn" id="checkoutBtn" onclick="goCheckout()" style="display:none;">
  <span>Proceed to Checkout</span>
  <span class="checkout-arrow"><svg class="icon" style="width:16px;height:16px;stroke:#fff;" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
</button>

<div id="toast-container"></div>

<div id="bottom-nav"></div>
<script src="/js/bottom-nav.js"></script>

<!-- ══ ALL ORIGINAL CART FIREBASE LOGIC ══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:    "AIzaSyD_AhACSdb6ddlmNWU3UNKxUSBj-0pSIA8",
  authDomain:"food-delivery-app-97300.firebaseapp.com",
  projectId: "food-delivery-app-97300"
};
initializeApp(firebaseConfig);
const db   = getFirestore();
const auth = getAuth();

// ── Coupon engine ──
// The app has no coupon collection, so this is an explicit, limited promo rule.
// Anything else is rejected; there is no silent fake discount.
const COUPONS = {
  WELCOME10: { type: "percent", value: 10, min: 199, label: "10% off orders above ₹199" },
  FREEDEL:   { type: "delivery", value: 0, min: 299, label: "Free delivery above ₹299" },
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }

  let platformFee = 3;
  let deliveryFee = 30;

  const settingsSnap = await getDoc(doc(db, "settings", "appConfig"));
  if (settingsSnap.exists()) {
    const s    = settingsSnap.data();
    platformFee = s.platformFee || 3;
    const distance = Number(localStorage.getItem("restaurantDistance")) || 0;
    if      (distance <= 3)  deliveryFee = s.fee0to3   || 30;
    else if (distance <= 7)  deliveryFee = s.fee3to7   || 50;
    else if (distance <= 10) deliveryFee = s.fee7to10  || 70;
    else                     deliveryFee = s.fee10plus || 100;
  }

  let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
  const container = document.getElementById("cart");
  const restaurantWrap = document.getElementById("cartRestaurant");

  const subtotalEl   = document.getElementById("subtotal");
  const totalEl      = document.getElementById("total");
  const summaryBox   = document.getElementById("summaryBox");
  const checkoutBtn  = document.getElementById("checkoutBtn");
  const discountRow  = document.getElementById("discountRow");
  const discountVal  = document.getElementById("discountValue");
  const couponNote   = document.getElementById("couponNote");

  let appliedCoupon = null;

  function money(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }

  function paintRestaurant() {
    if (!cartItems.length) { restaurantWrap.innerHTML = ""; return; }
    const first = cartItems[0];
    const kinds = new Set(cartItems.map((i) => i.veg === false ? "Non-veg" : "Veg"));
    const kindText = [...kinds].join(" & ");
    restaurantWrap.innerHTML = `
      <div class="cart-restaurant">
        <img class="cart-restaurant-img" src="${first.image || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=120&q=80"}" alt="">
        <div class="cart-restaurant-copy">
          <div class="cart-restaurant-name">${first.restaurantName || "Your restaurant"}</div>
          <div class="cart-restaurant-sub">${cartItems.reduce((s, i) => s + i.qty, 0)} item(s)${kindText ? " · " + kindText : ""}</div>
        </div>
        <button class="cart-clear" id="clearCartBtn" type="button">Clear</button>
      </div>`;
    document.getElementById("clearCartBtn")?.addEventListener("click", () => {
      if (!window.confirm("Remove all items from your cart?")) return;
      cartItems = [];
      persist();
      renderCart();
    });
  }

  function updateCartCount() {
    const count = cartItems.reduce((s, i) => s + i.qty, 0);
    if (window.refreshCartBadge) window.refreshCartBadge();
    window.dispatchEvent(new CustomEvent("cartchange", { detail: { count } }));
  }

  function totals() {
    const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
    let discount = 0;
    let delivery = deliveryFee;

    if (appliedCoupon === "WELCOME10") discount = Math.round(subtotal * 0.10);
    if (appliedCoupon === "FREEDEL")   delivery = 0;

    return { subtotal, discount, delivery, total: subtotal + delivery + platformFee - discount };
  }

  function persist() {
    localStorage.setItem("cart", JSON.stringify(cartItems));
    if (appliedCoupon) localStorage.setItem("cartCoupon", appliedCoupon);
    else localStorage.removeItem("cartCoupon");
  }

  function paintBill() {
    const t = totals();
    document.getElementById("deliveryFee").innerText = money(t.delivery);
    document.getElementById("platformFee").innerText = money(platformFee);
    subtotalEl.innerText = money(t.subtotal);
    totalEl.innerText = money(t.total);

    if (t.discount > 0) {
      discountRow.style.display = "flex";
      discountVal.innerText = "-" + money(t.discount);
    } else {
      discountRow.style.display = "none";
    }

    if (appliedCoupon) {
      const def = COUPONS[appliedCoupon];
      couponNote.className = "coupon-note ok";
      couponNote.innerText = def ? def.label + " applied" : "Coupon applied";
    } else {
      couponNote.className = "coupon-note";
      couponNote.innerText = "";
    }
    persist();
  }

  function renderCart() {
    container.innerHTML = "";
    paintRestaurant();

    if (cartItems.length === 0) {
      container.innerHTML = `
        <div class="empty-cart">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2.5l2.5 12.5h10L20 7H6"/></svg>
          <h3>Your cart is empty</h3>
          <p>Add something delicious to get started</p>
          <a href="explore.html" class="empty-cta">Browse Restaurants</a>
        </div>`;
      summaryBox.style.display  = "none";
      checkoutBtn.style.display = "none";
      updateCartCount();
      return;
    }

    summaryBox.style.display  = "block";
    checkoutBtn.style.display = "flex";

    cartItems.forEach((item, index) => {
      const lineTotal = item.price * item.qty;
      const div = document.createElement("div");
      div.className = "cart-card";

      div.innerHTML = `
        <div class="food-left">
          <img class="cart-item-image" src="${item.image || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80"}" alt="${item.name}">
          <div style="min-width:0;">
            <div class="food-name">${item.name}</div>
            <div class="food-desc" style="-webkit-line-clamp:1;">${money(item.price)} each</div>
            <div class="quantity-box">
              <button onclick="decrease(${index})" aria-label="Decrease quantity">−</button>
              <span class="qty-num">${item.qty}</span>
              <button onclick="increase(${index})" aria-label="Increase quantity">+</button>
            </div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="food-line-total">${money(lineTotal)}</div>
          <button class="cart-remove" onclick="removeItem(${index})" type="button" aria-label="Remove ${item.name}">✕</button>
        </div>`;

      container.appendChild(div);
    });

    paintBill();
    updateCartCount();
  }

  window.increase = function (index) {
    cartItems[index].qty++;
    persist();
    renderCart();
  };

  window.decrease = function (index) {
    if (cartItems[index].qty > 1) { cartItems[index].qty--; }
    else                          { cartItems.splice(index, 1); }
    persist();
    renderCart();
  };

  window.removeItem = function (index) {
    const removed = cartItems.splice(index, 1)[0];
    persist();
    renderCart();
    if (removed) console.info("Removed from cart:", removed.name);
  };

  window.goCheckout = function () {
    if (cartItems.length === 0) { alert("Cart empty"); return; }

    const restaurantId = cartItems[0].restaurantId;
    const mixed = cartItems.some(i => i.restaurantId !== restaurantId);
    if (mixed) { alert("Only one restaurant allowed per order"); return; }

    const t = totals();
    localStorage.setItem("checkoutData", JSON.stringify({
      items: cartItems,
      restaurantId,
      subtotal: t.subtotal,
      deliveryFee: t.delivery,
      platformFee,
      discount: t.discount,
      coupon: appliedCoupon,
      total: t.total
    }));
    window.location.href = "checkout.html";
  };

  document.getElementById("couponBtn")?.addEventListener("click", () => {
    const input = document.getElementById("couponInput");
    const code = String(input.value || "").trim().toUpperCase();
    if (!code) {
      appliedCoupon = null;
      couponNote.className = "coupon-note";
      couponNote.innerText = "";
      paintBill();
      renderCart();
      return;
    }

    const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
    const def = COUPONS[code];
    if (!def) {
      couponNote.className = "coupon-note bad";
      couponNote.innerText = "Invalid coupon code.";
      appliedCoupon = null;
      paintBill();
      renderCart();
      return;
    }
    if (subtotal < def.min) {
      couponNote.className = "coupon-note bad";
      couponNote.innerText = "Add " + money(def.min - subtotal) + " more to use " + code + ".";
      appliedCoupon = null;
      paintBill();
      renderCart();
      return;
    }
    appliedCoupon = code;
    paintBill();
    renderCart();
  });

  document.getElementById("couponInput")?.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("couponBtn")?.click();
    }
  });

  // Restore a previously applied coupon only if it still qualifies.
  const storedCoupon = localStorage.getItem("cartCoupon");
  if (storedCoupon && COUPONS[storedCoupon]) {
    const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
    if (subtotal >= COUPONS[storedCoupon].min) appliedCoupon = storedCoupon;
  }

  renderCart();
});
</script>

<!-- ── SERVICE WORKER ── -->
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
</script>

<!-- ── LOADER HIDE ── -->
<script>
window.addEventListener("load", () => {
  setTimeout(() => { document.getElementById("loader").classList.add("hidden"); }, 400);
});
</script>

</body>
</html>
