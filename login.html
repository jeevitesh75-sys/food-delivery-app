<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eluru Foods · Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/liquid-glass.css">
</head>
<body style="padding-bottom:0;">

<div class="login-page-wrap">
  <div class="login-container">

    <div class="logo-wrap">
      <div class="logo-ring">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 11a8 8 0 0 1 16 0"/><path d="M3 11h18v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2Z"/><path d="M12 3v2"/></svg>
      </div>
      <div class="logo-title">Eluru Foods</div>
      <div class="logo-jp">Fine Dining, Delivered</div>
    </div>

    <div class="card-login">
      <div class="card-title">Welcome Back</div>
      <div class="card-subtitle">Order from the finest local kitchens,<br>delivered with care</div>

      <div class="gold-rule"></div>

      <div class="tagline">
        <span class="tag-pill"><svg class="icon" style="width:12px;height:12px;" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>Fast</span>
        <span class="tag-pill"><svg class="icon" style="width:12px;height:12px;" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Easy</span>
        <span class="tag-pill"><svg class="icon" style="width:12px;height:12px;" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Local</span>
      </div>

      <button class="login-btn" onclick="googleLogin()">
        <svg class="g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

      <div class="err-toast" id="errToast"></div>

      <div class="bottom-note">By continuing you agree to our Terms &amp; Privacy Policy</div>
    </div>

  </div>
</div>

<!-- ══ ALL ORIGINAL FIREBASE LOGIC (UNTOUCHED) ══ -->
<script type="module">
import { initializeApp }           from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:    "AIzaSyD_AhACSdb6ddlmNWU3UNKxUSBj-0pSIA8",
  authDomain:"food-delivery-app-97300.firebaseapp.com",
  projectId: "food-delivery-app-97300"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  const userRef = doc(db, "users", user.uid);
  const snap    = await getDoc(userRef);

  if (snap.exists()) {
    const data = snap.data();
    if (data.policyAccepted) {
      if (data.phone && data.address) {
        location.href = "home.html";
      } else {
        location.href = "details.html";
      }
    } else {
      location.href = "accept.html";
    }
  } else {
    location.href = "accept.html";
  }
});

window.googleLogin = async () => {
  const btn = document.querySelector('.login-btn');
  btn.classList.add('loading');

  try {
    const result = await signInWithPopup(auth, provider);
    const user   = result.user;

    localStorage.setItem("user", JSON.stringify(user));

    const userRef = doc(db, "users", user.uid);
    const snap    = await getDoc(userRef);

    if (snap.exists()) {
      const data = snap.data();
      if (data.policyAccepted) {
        if (data.phone && data.address) {
          location.href = "home.html";
        } else {
          location.href = "details.html";
        }
      } else {
        location.href = "accept.html";
      }
    } else {
      await setDoc(userRef, {
        name:      user.displayName,
        email:     user.email,
        photo:     user.photoURL,
        createdAt: new Date()
      });
      location.href = "accept.html";
    }

  } catch (err) {
    btn.classList.remove('loading');
    const toast = document.getElementById('errToast');
    toast.textContent = err.message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }
};
</script>

<!-- ── SERVICE WORKER ── -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
