<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Earnings</h1><p>Your profit from every delivered order.</p></div>
<div class="stats">
<div class="stat "><div class="stat-label">Today's earnings</div><div class="stat-value" id="todayEarn">₹0</div></div>
<div class="stat dark"><div class="stat-label">Total earnings</div><div class="stat-value" id="totalEarn">₹0</div></div>
<div class="stat blue"><div class="stat-label">Platform fees</div><div class="stat-value" id="platformEarn">₹0</div></div>
<div class="stat warn"><div class="stat-label">Delivered orders</div><div class="stat-value" id="deliveredOrders">0</div></div>
</div>
<div class="toolbar"><button class="btn-ghost" id="resetBtn">Reset today's earnings</button></div>
<div class="list" id="earningsList"></div>
</div></main>
<script type="module" src="js/earnings.js"></script>
</body>
</html>
