<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurants - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Restaurants</h1><p>Open, close or remove restaurants.</p></div>
<div class="stats">
<div class="stat "><div class="stat-label">Total restaurants</div><div class="stat-value" id="totalRestaurants">0</div></div>
<div class="stat blue"><div class="stat-label">Open</div><div class="stat-value" id="openRestaurants">0</div></div>
<div class="stat warn"><div class="stat-label">Closed</div><div class="stat-value" id="closedRestaurants">0</div></div>
<div class="stat dark"><div class="stat-label">Today's earnings</div><div class="stat-value" id="todayEarnings">₹0</div></div>
<div class="stat "><div class="stat-label">Lifetime earnings</div><div class="stat-value" id="lifetimeEarnings">₹0</div></div>
</div>
<div class="toolbar">
<input class="grow" type="text" id="searchRestaurant" placeholder="Search restaurant...">
<button class="btn-ghost" id="resetTodayBtn">Reset today's earnings</button>
</div>
<div class="table-box"><table>
<thead><tr><th>Image</th><th>Name</th><th>Owner</th><th>Phone</th><th>Status</th><th>Today</th><th>Total</th><th>Actions</th></tr></thead>
<tbody id="restaurantTable"></tbody></table></div>
</div></main>
<script type="module" src="js/restaurants.js"></script>
</body>
</html>
