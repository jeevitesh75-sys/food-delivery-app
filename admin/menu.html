<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Menu</h1><p>Tap a restaurant to edit its foods.</p></div>
<div id="restaurantList"><div class="loading-state">Loading restaurants...</div></div>
<div id="editModal"><div class="modal-box">
<h3>Edit food item</h3>
<input id="editName" placeholder="Food name">
<input id="editPrice" placeholder="Price" type="number">
<input id="editImage" placeholder="Image URL">
<div class="modal-actions"><button class="btn-save" onclick="saveEdit()">Save</button><button class="btn-cancel" onclick="closeEdit()">Cancel</button></div>
</div></div>
</div></main>
<script type="module" src="js/menu.js"></script>
</body>
</html>
