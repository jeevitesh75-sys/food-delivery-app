<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Boys - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Delivery Boys</h1><p>Riders, their status and earnings.</p></div>
<div class="stats">
<div class="stat "><div class="stat-label">Total delivery boys</div><div class="stat-value"><span id="totalBoys">0</span></div></div>
<div class="stat blue"><div class="stat-label">Online now</div><div class="stat-value"><span id="onlineBoys">0</span></div></div>
<div class="stat warn"><div class="stat-label">Today's earnings</div><div class="stat-value">₹<span id="todayEarn">0</span></div></div>
<div class="stat dark"><div class="stat-label">Total earnings</div><div class="stat-value">₹<span id="totalEarn">0</span></div></div>
<div class="stat "><div class="stat-label">Today's collection</div><div class="stat-value">₹<span id="todayCollection">0</span></div></div>
</div>
<div class="toolbar"><button class="btn-ghost" id="resetBtn">Reset today's earnings</button></div>
<div class="table-box"><table>
<thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Today</th><th>Total</th><th>Collection today</th></tr></thead>
<tbody id="deliveryTable"></tbody></table></div>
</div></main>
<script type="module" src="js/deliveryboys.js"></script>
</body>
</html>
