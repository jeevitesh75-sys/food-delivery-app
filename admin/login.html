<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Eluru Foods</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-wrap"><form class="login-box" id="loginForm">
  <div class="brand"><div class="brand-mark">E</div><div><h2>Eluru Foods</h2><div class="brand-sub">Admin panel - sign in to continue</div></div></div>
  <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required></div>
  <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
  <div id="loginErr" class="notice err"></div>
  <button type="submit" id="loginBtn">Sign in</button>
</form></div>
<script type="module">
import { auth } from "./js/fb.js";
import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, (user) => { if (user) window.location.href = "index.html"; });

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
  err.classList.remove("show"); btn.disabled = true; btn.textContent = "Signing in...";
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
    window.location.href = "index.html";
  } catch (ex) {
    err.textContent = "Login failed. Check your email and password.";
    err.classList.add("show"); btn.disabled = false; btn.textContent = "Sign in";
    console.log(ex);
  }
});
</script>
</body>
</html>
