<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Settings</h1><p>Pricing and delivery fees used by the customer app.</p></div>
<div class="panel"><h3>Food pricing</h3>
<div class="form-grid">
<div class="field"><label for="foodMarkup">Food markup (%)</label><input id="foodMarkup" inputmode="decimal"></div>
<div class="field"><label for="platformFee">Platform fee (₹)</label><input id="platformFee" inputmode="decimal"></div>
</div></div>
<div class="panel"><h3>Delivery fees</h3>
<div class="form-grid">
<div class="field"><label for="fee0to3">0 - 3 km (₹)</label><input id="fee0to3" inputmode="decimal"></div>
<div class="field"><label for="fee3to7">3 - 7 km (₹)</label><input id="fee3to7" inputmode="decimal"></div>
<div class="field"><label for="fee7to10">7 - 10 km (₹)</label><input id="fee7to10" inputmode="decimal"></div>
<div class="field"><label for="fee10plus">10+ km (₹)</label><input id="fee10plus" inputmode="decimal"></div>
</div></div>
<button class="btn-lg" onclick="saveSettings()">Save settings</button>
</div></main>
<script type="module" src="js/settings.js"></script>
</body>
</html>
