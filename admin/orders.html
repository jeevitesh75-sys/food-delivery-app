<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders - Eluru Foods Admin</title>
<meta name="theme-color" content="#249B55">
<link rel="stylesheet" href="css/admin.css">

<script src="js/shell.js" defer></script>
</head>
<body>
<main class="main"><div class="content">
<div class="page-head"><h1>Orders</h1><p>All orders, newest first.</p></div>
<div class="stats">
<div class="stat "><div class="stat-label">Total orders</div><div class="stat-value" id="totalOrders">0</div></div>
<div class="stat blue"><div class="stat-label">Today's orders</div><div class="stat-value" id="todayOrders">0</div></div>
<div class="stat dark"><div class="stat-label">Delivered</div><div class="stat-value" id="deliveredOrders">0</div></div>
</div>
<div class="toolbar"><button class="btn-ghost" onclick="resetTodayOrders()">Reset today's orders</button></div>
<div class="list" id="ordersList"></div>
</div></main>
<script type="module" src="js/orders.js"></script>
</body>
</html>
