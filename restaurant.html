<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu · Eluru Foods</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/liquid-glass.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
body { padding-bottom: 200px; }

.res-hero { position: relative; height: 190px; overflow: hidden; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.res-hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.72); }
.res-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
}
.res-hero-name { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; letter-spacing: -0.01em; }
.res-hero-meta { font-size: 12px; color: rgba(255,255,255,0.75); letter-spacing: 0.04em; }
.res-back-btn {
  position: absolute; top: 16px; left: 16px;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--glass-strong); backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 5; color: var(--ink); text-decoration: none;
}

.menu-section-head { padding: 18px 20px 8px; display: flex; align-items: center; gap: 12px; }
.menu-section-title { font-size: 17px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.menu-section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--ink-faint), transparent); }
.menu-section-count { font-size: 11.5px; color: var(--ink-muted); font-weight: 600; white-space: nowrap; }

#loadMore {
  display: none; margin: 16px auto; padding: 12px 32px;
  background: var(--glass); backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border); border-radius: 30px;
  color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer;
  width: 90%;
}
.empty-menu { text-align: center; padding: 60px 30px; color: var(--ink-muted); }
.empty-menu svg.icon { width: 42px; height: 42px; margin: 0 auto 14px; opacity: 0.4; }
.empty-menu p { font-size: 15px; font-weight: 600; }
</style>
<link rel="stylesheet" href="/css/hero-drop.css">
<script src="/js/hero-drop.js" defer></script>
</head>

<body>

<div class="res-hero" id="resHero">
  <a class="res-back-btn" href="home.html">
    <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <img class="res-hero-img" id="resHeroImg" src="" alt="Restaurant">
  <div class="res-hero-overlay">
    <div class="res-hero-name" id="resHeroName">Loading…</div>
    <div class="res-hero-meta" id="resHeroMeta">Menu</div>
  </div>
</div>

<div class="menu-section-head">
  <div class="menu-section-title">Our Menu</div>
  <div class="menu-section-line"></div>
  <div class="menu-section-count" id="menuCount"></div>
</div>

<div id="menuContainer"></div>

<button id="loadMore">Load More</button>

<a href="cart.html" class="cart-bar" id="cartBar" style="display:none;">
  <span>View Cart</span>
  <div class="cart-bar-right">
    <span id="cart-total-text"></span>
    <span id="cart-count"></span>
  </div>
</a>

<div class="bottom-nav">
  <a href="home.html" class="nav-item">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
  <a href="cart.html" class="nav-item">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2.5l2.5 12.5h10L20 7H6"/></svg>
    Cart
  </a>
  <a href="profile.html" class="nav-item">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
    Profile
  </a>
</div>

<!-- ══ ALL ORIGINAL FIREBASE LOGIC (UNTOUCHED) ══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, limit, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey:    "AIzaSyD_AhACSdb6ddlmNWU3UNKxUSBj-0pSIA8",
  authDomain:"food-delivery-app-97300.firebaseapp.com",
  projectId: "food-delivery-app-97300"
});

const db   = getFirestore(app);
const auth = getAuth(app);
let MENU_LIMIT = 30;

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }

  let foodMarkup = 0;
  const settingsSnap = await getDoc(doc(db, "settings", "appConfig"));
  if (settingsSnap.exists()) {
    foodMarkup = settingsSnap.data().foodMarkup || 0;
  }

  let restaurantId = localStorage.getItem("selectedRestaurant");
  if (!restaurantId) {
    alert("No restaurant selected");
    window.location.href = "home.html";
    return;
  }

  try {
    const resSnap = await getDoc(doc(db, "restaurants", restaurantId));
    if (resSnap.exists()) {
      const rd = resSnap.data();
      document.getElementById("resHeroName").textContent = rd.name || "Restaurant";
      document.getElementById("resHeroMeta").textContent =
        (rd.cuisine ? rd.cuisine + " · " : "") + "Menu";
      if (rd.image) document.getElementById("resHeroImg").src = rd.image;
    }
  } catch(e) {}

  let container = document.getElementById("menuContainer");

  function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
  }

  function updateCartCount() {
    const cart  = getCart();
    const count = cart.reduce((s, i) => s + i.qty, 0);
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const badge = document.getElementById("cart-count");
    const bar   = document.getElementById("cartBar");
    const tt    = document.getElementById("cart-total-text");

    if (count > 0) {
      badge.textContent  = count + " items";
      badge.style.display = "inline-block";
      if (tt) tt.textContent = "₹" + total;
      if (bar) bar.style.display = "flex";
    } else {
      badge.style.display = "none";
      if (bar) bar.style.display = "none";
    }
  }

  window.changeQty = function (name, restaurantPrice, finalPrice, image, delta) {
    let cart = getCart();
    let item = cart.find(i => i.name === name);

    if (item) {
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
    } else if (delta === 1) {
      cart.push({
        name,
        restaurantPrice,
        markup: Number(foodMarkup || 0),
        price: finalPrice,
        image,
        qty: 1,
        restaurantId
      });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    loadMenu();
    updateCartCount();
  };

  async function loadMenu() {
    const q        = query(collection(db, "menu"), where("restaurantId","==",restaurantId), limit(MENU_LIMIT));
    const snapshot = await getDocs(q);
    const cart     = getCart();

    let count = 0;
    let html  = "";

    snapshot.forEach((docSnap) => {
      const food = docSnap.data();
      if (food.enabled === false) return;
      count++;

      const finalPrice = Number(food.price || 0) + Number(foodMarkup || 0);
      const item       = cart.find(i => i.name === food.name);
      const qty        = item ? item.qty : 0;
      const imgSrc     = food.image || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80";

      const qtyControls = qty > 0
        ? `<div class="qty-box">
             <button onclick="changeQty('${food.name}',${food.price},${finalPrice},'${food.image}',-1)">−</button>
             <span class="qty-val">${qty}</span>
             <button onclick="changeQty('${food.name}',${food.price},${finalPrice},'${food.image}',1)">+</button>
           </div>`
        : `<button class="add-btn-kintsugi"
             onclick="changeQty('${food.name}',${food.price},${finalPrice},'${food.image}',1)">
             + Add
           </button>`;

      html += `
        <div class="food-card">
          <img class="food-image" loading="lazy"
               src="${imgSrc}" alt="${food.name}">
          <div class="food-info">
            <div class="food-name">${food.name}</div>
            ${food.description ? `<div class="food-desc">${food.description}</div>` : ''}
            <div class="food-price">₹${finalPrice}</div>
            ${qtyControls}
          </div>
        </div>`;
    });

    if (count === 0) {
      html = `<div class="empty-menu">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14v4"/><path d="M12 10v8"/><path d="M17 6v12"/></svg>
                <p>No items available</p>
              </div>`;
    }

    container.innerHTML = html;
    document.getElementById("menuCount").textContent = count > 0 ? count + " items" : "";
    document.getElementById("loadMore").style.display = snapshot.size >= MENU_LIMIT ? "block" : "none";
    updateCartCount();
  }

  document.getElementById("loadMore").onclick = async () => {
    MENU_LIMIT += 20;
    await loadMenu();
  };

  loadMenu();
});
</script>

<!-- ── SERVICE WORKER ── -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
